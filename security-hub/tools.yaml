    - name: DenyIP (Pineapple infusion)
      where: Pineapple web UI
      kind: web
      link: http://192.168.1.50:1471/#/Modules/DenyIP
      note: Client isolation / IP blocking on the Pineapple's rogue AP

- category: Web / CTF (HackerOne, HTB, THM)
  entries:
    - name: ffuf / gobuster
      where: Pi, SSH
      kind: cli
      note: "ffuf -u https://target/FUZZ -w seclists/Discovery/Web-Content/raft-large-directories.txt"
    - name: nikto
      where: Pi, SSH
      kind: cli
      note: "nikto -h https://target"
    - name: sqlmap
      where: Pi, SSH
      kind: cli
      note: "sqlmap -u '<url>' --batch --dbs"
    - name: SecLists
      where: /usr/share/wordlists/seclists on the Pi
      kind: cli
      note: Full wordlist collection for the above
    - name: cabinet (Pineapple infusion)
      where: Pineapple web UI
      kind: web
      link: http://192.168.1.50:1471/#/Modules/cabinet
      note: Browser-based file manager — browse captures/loot without SSH

