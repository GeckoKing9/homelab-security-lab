- category: WiFi capture & crack
  entries:
    - name: hcxdumptool (Pineapple GUI infusion)
      where: Pineapple web UI
      kind: web
      link: http://192.168.1.50:1471/#/Modules/hcxdumptool
      note: Self-service PMKID/handshake capture — click-to-run, no SSH needed
    - name: handshake_capture.py
      where: this hub, form below
      kind: web
      note: Full automated pipeline — capture, convert, crack, report, notify
    - name: reaver + pixiewps (WPS/Pixie Dust)
      where: Pineapple, SSH
      kind: cli
      note: "reaver -i wlan1mon -b <bssid> -c <channel> -K 1"
    - name: aircrack-ng
      where: Pi, SSH
      kind: cli
      note: "aircrack-ng -w rockyou.txt capture.cap  (legacy 4-way handshakes)"
    - name: hashcat -m 22000
      where: Pi, SSH
      kind: cli
      note: "hashcat -m 22000 hash.22000 rockyou.txt -r best64.rule"

- category: Recon
  entries:
    - name: PineAP recon
      where: Pineapple web UI / API
      kind: web
      link: http://192.168.1.50:1471/#/Recon
      note: Channel-hopping AP/client discovery, feeds the blue-team monitor
    - name: nmap (Pineapple GUI infusion)
      where: Pineapple web UI
      kind: web
      link: http://192.168.1.50:1471/#/Modules/nmap
      note: Web GUI for nmap, scan from the Pineapple's vantage point
    - name: nmap (Pi CLI)
      where: Pi, SSH
      kind: cli
      note: "nmap -sV -A <target>"
    - name: MACInfo (Pineapple infusion)
      where: Pineapple web UI
      kind: web
      link: http://192.168.1.50:1471/#/Modules/MACInfo
      note: MAC vendor lookup
    - name: wigle (Pineapple infusion)
      where: Pineapple web UI
      kind: web
      link: http://192.168.1.50:1471/#/Modules/wigle
      note: WiGLE.net AP history/geolocation lookup
    - name: NetAlertX
      where: SSH-forward — ssh -L 20211:127.0.0.1:20211 homelab
      kind: web
      note: Always-on rogue-device ARP monitor, alerts on ntfy homelab-netalert

- category: MITM / traffic interception
  entries:
    - name: bettercap
      where: Pi, SSH
      kind: cli
      note: "bettercap -iface eth0 — ARP-spoof, sslstrip2, hstshijack caplets (wired LAN, same segment as the router)"
    - name: httpeek (Pineapple infusion)
      where: Pineapple web UI
      kind: web
      link: http://192.168.1.50:1471/#/Modules/httpeek
      note: Live plaintext HTTP viewer for clients associated to the Pineapple
    - name: ProxyHelper2 (Pineapple infusion)
      where: Pineapple web UI
      kind: web
      link: http://192.168.1.50:1471/#/Modules/ProxyHelper2
      note: Force an associated client's TCP traffic through Burp Suite Proxy
    - name: tcpdump (Pineapple GUI infusion)
      where: Pineapple web UI
      kind: web
      link: http://192.168.1.50:1471/#/Modules/tcpdump
      note: Web GUI packet capture on the Pineapple's interfaces
    - name: DNSspoof (Pineapple infusion — LIVE drills only)
      where: Pineapple web UI
      kind: web
      link: http://192.168.1.50:1471/#/Modules/DNSspoof
      note: Own network only, explicit go-ahead each time — see dns-sandbox for practice first
    - name: dns-sandbox
      where: Pi, ~/stacks/dns-sandbox
      kind: cli
      note: "docker compose up -d — fully isolated practice lab, zero risk to the real network"

- category: Evil twin / rogue AP
  entries:
    - name: Evil Portal (Pineapple infusion, installed)
      where: Pineapple web UI
      kind: web
      link: http://192.168.1.50:1471/#/Modules/evilportal
      note: Captive-portal credential-harvesting drill — configure a campaign before use
    - name: PineAP Karma mode
      where: this hub (toggle below) or Pineapple web UI
      kind: web
      link: http://192.168.1.50:1471/#/PineAP
      note: "OFF by default — responds to ALL nearby probing devices, not just yours. Enable deliberately, per session."
    - name: mdk4 (Pineapple GUI infusion)
